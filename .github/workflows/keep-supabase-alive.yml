name: Keep Supabase Alive

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This workflow pings the project's REST API twice a week (well under that
# 7-day limit) so images/videos hosted on Supabase Storage never go offline.

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Every Monday & Thursday, 9:00 AM UTC
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          echo "Pinging Supabase project to prevent inactivity pause..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zxfinszfbnmatwamahyf.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response status: $HTTP_STATUS"

          # Supabase's REST root returns 200/404 for a healthy project either way —
          # what matters is that the request reached the project at all.
          if [ "$HTTP_STATUS" -ge 500 ] || [ "$HTTP_STATUS" -eq 000 ]; then
            echo "::error::Supabase project did not respond (status $HTTP_STATUS). It may be paused — check the dashboard."
            exit 1
          fi

          echo "Supabase project is reachable. Inactivity timer reset."
